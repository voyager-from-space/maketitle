<body class="home">

  <main>
    <p class="lead">Replace arxiv.org with maketitle.vercel.app in any paper URL. The source opens and compiles in this tab.</p>
    <p class="correction" aria-label="Example: swap the host, keep the path">
      <span class="strike">arxiv.org</span> <span class="insert">maketitle.vercel.app</span><span class="path">/abs/1706.03762</span>
    </p>
    <form class="go" action="abs.html" method="get">
      <label class="sr" for="q">arXiv URL, identifier, or zip</label>
      <input id="q" name="q" type="text" autofocus placeholder="arXiv URL, id, or a zip" />
      <button type="submit">Open</button>
    </form>
    <p class="hint">No account. The compile runs on your computer.</p>
  </main>
